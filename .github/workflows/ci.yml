name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No dependencies to install: the suite uses node's built-in test runner.
      - name: Tests
        run: npm test
      - name: Web tool is built from current libraries
        run: node web/build.js && git diff --exit-code web/compare.html
